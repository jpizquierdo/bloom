name: Deploy demo

on:
  # Deploy only what CI has already passed, never a red main.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one mid-flight.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to FastAPI Cloud
    runs-on: ubuntu-latest
    # workflow_run carries this repo's secrets, and `branches` matches a fork's branch named main
    # too, so also require a successful run of a push to this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main has moved on to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Mirrors the Docker build: the API serves the compiled UI from bloom/static.
      - name: Build the web UI
        working-directory: frontend
        run: npm run build -- --outDir ../bloom/static --emptyOutDir

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"

      - name: Deploy to FastAPI Cloud
        run: uv run --frozen fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
