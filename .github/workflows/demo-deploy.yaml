name: Deploy demo

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once, and never cancel one mid-flight.
concurrency:
  group: demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to FastAPI Cloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Mirrors the Docker build: the API serves the compiled UI from bloom/static.
      - name: Build the web UI
        working-directory: frontend
        run: npm run build -- --outDir ../bloom/static --emptyOutDir

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"

      - name: Deploy to FastAPI Cloud
        run: uv run --frozen fastapi deploy
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}
